[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wrongway"
version = "1.0.0"
description = "Self-calibrating wrong-way vehicle detection for multi-camera CCTV networks (Naval Anchorage)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8", "PyYAML>=6.0"]

[project.optional-dependencies]
gpu = ["ultralytics>=8.3"]
test = ["pytest"]

[project.scripts]
wrongway = "wrongway.cli:main"

[tool.setuptools]
packages = ["wrongway"]
